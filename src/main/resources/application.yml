# SERVER 설정
server:
  port: 9091
  shutdown: graceful

# SPRING 설정
spring:
  application:
    name: checkout-redesign
  web:
    locale: ko_KR
    resources:
      add-mappings: false
  jackson:
    time-zone: UTC
  # 신규 DB (JPA). 테이블은 db/new/new_db.sql 로 만들고 Hibernate 가 DDL 을 실행하지 않는다
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

# SQLite 파일 2개. 시작할 때마다 init-scripts 로 새로 만든다 (기존 테이블을 지우고 다시 실행)
checkout:
  datasource:
    new:
      path: data/new.db
      foreign-keys: true   # order_item → orders. SQLite 는 기본으로 외래 키를 검사하지 않는다
      init-scripts:
        - classpath:db/new/new_db.sql
    legacy:
      path: data/legacy.db
      init-scripts:
        - classpath:db/legacy/legacy_db.sql            # 과제 원본의 사본
        - classpath:db/legacy/legacy_new_ord_apply.sql # 신규 시스템이 추가하는 반영 기록 테이블
  # 중간 상태에 머문 주문을 끝까지 진행하거나 되돌리는 복구 작업자 (DESIGN.md 5.3)
  recovery:
    enabled: true
    interval: 10s
    # PENDING·CANCELING 에 이 시간 넘게 머문 주문을 복구한다. 정상 처리 중인 요청과 겹치지 않을 만큼 길게 둔다
    stuck-after: 1m
    # RESERVED 에서 이 시간 넘게 결제되지 않은 주문을 되돌린다
    unpaid-after: 5m
